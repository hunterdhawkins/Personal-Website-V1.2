{% extends "base.html" %}
{% load static %}
{% block content %}
<section class="bg-light py-3">
    <div class="container px-5">
        <div class="row gx-5 justify-content-center">
            <div class="col-xxl-12">
                <div class="text-center my-2">
                    <h2 class="display-5 fw-bolder"><span class="text-gradient d-inline">Projects</span></h2>
                    <div class="container my-5">
                        <div class="row g-4">

                        	{% for project in projects %}
	                            <div class="col-12">
	                                <div class="card shadow-sm education-card">
	                                    <div class="card-body text-start">
	                                        <div class="d-flex justify-content-between flex-wrap">
	                                            <h5 class="mb-1">{{project.project_name}}</h5>
	                                            <span class="fw-semibold">{{project.project_location}}</span>
	                                        </div>
	                                        <div class="d-flex justify-content-between flex-wrap">
	                                            <p class="mb-1 text-muted fw-semibold">{{project.project_description}}</p>
	                                        </div>
											<a href="{% url 'home-individual-project' slug=project.slug %}" class="btn btn-info" role="button">Learn More</a>
	                                    </div>
	                                </div>
	                            </div>
                            {% endfor %}

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
{% block page_scripts %}
{% endblock %}
