{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
.pdf-container {
  height: 100vh;
  width: 100vw;
}

</style>

<section class="bg-body py-1">
  <div class="text-center pdf-container">
    
    <!-- Create a link to download/view the file -->
    <a class="fs-1" href="{{ resume.document.url }}" target="_blank">
        View/Download File
    </a>
    <div class="mb-3"></div>
    <embed src="{{ resume.document.url }}" type="application/pdf" width="60%" height="90%" />

  </div>
</section>
{% endblock %}
