{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Hunter Hawkins is a software developer and systems integrator based in Coeur d'Alene, Idaho, specializing in machine learning, industrial controls, and automation." />
        <meta name="author" content="Hunter Hawkins" />
        <title>{% block title %}Hunter Hawkins - Software Developer | Coeur d'Alene, Idaho{% endblock %}</title>
        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Hunter Hawkins" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:title" content="{% block og_title %}Hunter Hawkins - Software Developer | Coeur d'Alene, Idaho{% endblock %}" />
        <meta property="og:description" content="{% block og_description %}Hunter Hawkins is a software developer and systems integrator based in Coeur d'Alene, Idaho, specializing in machine learning, industrial controls, and automation.{% endblock %}" />
        <meta property="og:url" content="{{ request.build_absolute_uri }}" />
        <meta property="og:image" content="{% block og_image %}https://www.hunterdhawkins.com/media/images/hunter-favicon.png{% endblock %}" />
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="{% block twitter_title %}Hunter Hawkins - Software Developer | Coeur d'Alene, Idaho{% endblock %}" />
        <meta name="twitter:description" content="{% block twitter_description %}Hunter Hawkins is a software developer and systems integrator based in Coeur d'Alene, Idaho, specializing in machine learning, industrial controls, and automation.{% endblock %}" />
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Hunter Hawkins",
          "jobTitle": "Software Developer & Systems Integrator",
          "url": "https://www.hunterdhawkins.com",
          "sameAs": [
            "https://www.linkedin.com/in/hunter-hawkins-552926170/",
            "https://github.com/hunterdhawkins"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Coeur d'Alene",
            "addressRegion": "ID",
            "addressCountry": "US"
          },
          "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "University of Idaho"
          },
          "knowsAbout": ["Machine Learning", "Artificial Intelligence", "Industrial Controls", "PLC Programming", "Django", "Python", "Robotics", "Systems Integration"]
        }
        </script>
        <link rel="canonical" href="{{ request.build_absolute_uri }}" />
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="/media/images/hunter-favicon.png" />
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Animate on scroll-->
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'template_css/styles.css' %}" rel="stylesheet" />
        <meta name="google-site-verification" content="GS-tx9NXelIESCxt2q8Cn5bvZx3W-EkagFRtb81Iwf4" />
    </head>
    <body class="d-flex flex-column h-100">
        <main class="flex-shrink-0">
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
                <div class="container px-5">
                    <a class="navbar-brand" href="{% url 'home-home' %}"><span class="fw-bolder text-primary">Hunter Hawkins</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
                            <li class="nav-item"><a class="nav-link" href="{% url 'home-home' %}">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'home-resume' %}">Resume</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'home-projects' %}">Projects</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'home-home' %}#contact">Contact</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </main>
        {% block content %}{% endblock %}
        <!-- Footer-->
        <footer class="bg-white py-4 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                    <div class="col-auto"><div class="small m-0">Developed by Hunter Hawkins</div></div>
                    <div class="col-auto">
                        <a class="small" href="{% url 'home-sources' %}">Sources</a>
<!--                         <span class="mx-1">&middot;</span>
                        <a class="small" href="#!">Terms</a> -->
                    </div>
                </div>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ELXYHTB61"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

          gtag('config', 'G-5ELXYHTB61');
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        {% block page_scripts %}{% endblock %}
    </body>
</html>
